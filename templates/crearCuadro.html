<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Crear Cuadro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="fondo-formulario">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="formulario-card shadow-lg">

            <h1 class="text-center mb-4">
                Crear Cuadro
            </h1>

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input type="text" name="nombre" class="form-control input-formulario" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Descripción
                    </label>

                    <textarea name="descripcion" class="form-control input-formulario" rows="4"></textarea>

                </div>



                <div class="mb-3">

                    <label class="form-label">
                        Peso en kg
                    </label>

                    <input type="number" name="peso" class="form-control input-formulario" min="0" step="0.01">

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Stock
                    </label>

                    <input type="number" name="stock" class="form-control input-formulario" min="0" required>

                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Categoría
                    </label>

                    <select name="id_categoria" class="form-select input-formulario" required>
                        <option value="">Seleccionar categoría</option>

                        {% for categoria in categorias %}
                        <option value="{{ categoria.id_categoria }}">
                            {{ categoria.nombre }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-4">

                    <label class="form-label">
                        <strong>Medidas y precios disponibles</strong>
                    </label>

                    {% for medida in medidas %}

                    <div class="row align-items-center mb-2">

                        <div class="col-5">

                            <div class="form-check">

                                <input class="form-check-input" type="checkbox" name="medidas_seleccionadas"
                                    value="{{ medida.id_medida }}" id="medida_{{ medida.id_medida }}">

                                <label class="form-check-label" for="medida_{{ medida.id_medida }}">
                                    {{ medida.ancho }} × {{ medida.alto }} cm
                                </label>

                            </div>

                        </div>

                        <div class="col-7">

                            <div class="input-group">

                                <span class="input-group-text">$</span>

                                <input type="number" name="precio_{{ medida.id_medida }}" class="form-control" min="0"
                                    step="1" placeholder="Precio"
                                    value="{% if medida.id_medida == 1 %}45000{% elif medida.id_medida == 2 %}65000{% endif %}">

                            </div>

                        </div>

                    </div>

                    {% endfor %}

                </div>



                <div class="mb-3">
                    <label class="form-label">
                        Luz
                    </label>

                    <select name="id_luz" class="form-select input-formulario" required>
                        <option value="">Seleccionar</option>

                        {% for luz in luces %}
                        <option value="{{ luz.id_luz }}">
                            {{ luz.descripcion }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">

                    <div class="form-check">

                        <input class="form-check-input" type="checkbox" name="destacado" id="destacado">

                        <label class="form-check-label" for="destacado">
                            Mostrar en destacados
                        </label>

                    </div>

                </div>




                <div class="mb-4">

                    <label class="form-label">
                        Imagen principal
                    </label>

                    <input type="file" name="imagen_principal" class="form-control input-formulario"
                        accept=".jpg,.jpeg,.png,.webp" required>

                </div>



                <div class="d-flex justify-content-between">

                    <button type="submit" class="btn btn-success">
                        Crear cuadro
                    </button>

                    <a href="/dashboard" class="btn btn-danger">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
