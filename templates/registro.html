<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - Prisma Studio</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="fondo-formulario">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="formulario-card shadow-lg">

        <h1 class="text-center mb-4">
            Crear cuenta
        </h1>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Nombre</label>

                <input
                    type="text"
                    name="nombre"
                    class="form-control input-formulario"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Apellido</label>

                <input
                    type="text"
                    name="apellido"
                    class="form-control input-formulario"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>

                <input
                    type="email"
                    name="email"
                    class="form-control input-formulario"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Teléfono</label>

                <input
                    type="tel"
                    name="telefono"
                    class="form-control input-formulario"
                >
            </div>

            <div class="mb-4">
                <label class="form-label">Contraseña</label>

                <input
                    type="password"
                    name="password"
                    class="form-control input-formulario"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn btn-comprar-cuadro w-100"
            >
                Crear cuenta
            </button>

        </form>

        <div class="text-center mt-4">

            <p>
                ¿Ya tenés una cuenta?
            </p>

            <a href="{{ url_for('login') }}">
                Iniciar sesión
            </a>

        </div>

    </div>

</div>

</body>
</html>
