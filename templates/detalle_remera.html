<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Detalle Remera</title>

</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <div class="card mx-auto shadow-lg" style="width: 28rem;">

        <img 
        src="{{ url_for('static', filename='img/' + disco.imagen_principal) }}"
        class="card-img-top"
        alt="Disco">

        <div class="card-body">

            <h2 class="card-title">
                {{ remera.nombre }}
            </h2>

            <p class="card-text">
                <strong>Banda:</strong> {{ remera.banda }}
            </p>

            <p class="card-text">
                <strong>TALLE:</strong> {{ remera.talle }}
            </p>

            <p class="card-text">
                <strong>Precio:</strong> ${{ remera.precio }}
            </p>

            <p class="card-text">
                <strong>Stock:</strong> {{ remera.stock }}
            </p>

            <a href="/dashboard" class="btn btn-primary">
                Volver
            </a>
             <a
                href="/comprar-remera/{{ remera.id }}"
                class="btn btn-success">

                    <i class="fa-solid fa-cart-shopping"></i>

                    Comprar

                </a>

        </div>

    </div>

</div>

</body>
</html>
