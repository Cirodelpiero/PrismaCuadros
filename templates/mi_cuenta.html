<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi cuenta - Prisma Studio</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="fondo-formulario">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="formulario-card shadow-lg">

        <div class="text-center mb-4">

            <i class="fa-regular fa-circle-user icono-cuenta"></i>

            <h1 class="mt-3">
                Mi cuenta
            </h1>

            <p class="text-muted">
                Tus datos personales
            </p>

        </div>


        <div class="datos-cuenta">

            <div class="dato-cuenta">
                <span>Nombre</span>
                <strong>{{ usuario.nombre }}</strong>
            </div>

            <div class="dato-cuenta">
                <span>Apellido</span>
                <strong>{{ usuario.apellido }}</strong>
            </div>

            <div class="dato-cuenta">
                <span>Email</span>
                <strong>{{ usuario.email }}</strong>
            </div>

            <div class="dato-cuenta">
                <span>Teléfono</span>
                <strong>
                    {{ usuario.telefono or "No especificado" }}
                </strong>
            </div>

        </div>


        <div class="d-grid gap-3 mt-4">

            <a href="{{ url_for('inicio') }}"
               class="btn btn-comprar-cuadro">

                <i class="fa-solid fa-store"></i>
                Volver a la tienda

            </a>

            <a href="{{ url_for('logout') }}"
               class="btn btn-outline-danger">

                <i class="fa-solid fa-right-from-bracket"></i>
                Cerrar sesión

            </a>

        </div>

    </div>

</div>

</body>

</html>
